<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0a74da" />
  <link rel="manifest" href="manifest.json" />
  <title>リアルタイムトランスレーター</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b10;
      color: #f7f7f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, rgba(10,116,218,.15), transparent 35%),
                  linear-gradient(180deg, #10131a 0%, #06080f 100%);
    }
    header {
      padding: 22px 18px 10px;
      display: grid;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.03em;
    }
    .select-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: end;
    }
    .swap-btn {
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      transition: background .15s, transform .2s;
      width: auto;
      box-shadow: none;
    }
    .swap-btn:active { background: rgba(255,255,255,.14); transform: rotate(180deg); }
    .select-label {
      font-size: .9rem;
      color: rgba(255,255,255,.68);
      display: block;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      padding: 14px 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: #fff;
      font-size: 1rem;
      appearance: none;
    }
    main {
      flex: 1;
      padding: 0 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .indicator {
      min-width: 90px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .95rem;
      text-align: center;
      background: rgba(255,255,255,.08);
      color: #f1f5f9;
      white-space: nowrap;
    }
    .indicator.recording {
      background: rgba(16, 185, 129, .18);
      color: #6ee7b7;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, .08);
    }
    .indicator.processing {
      background: rgba(234, 88, 12, .22);
      color: #ffb470;
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(234, 88, 12, .1); }
      50% { box-shadow: 0 0 0 9px rgba(234, 88, 12, .2); }
    }
    select:disabled, .swap-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    #toggleButton {
      flex: 1;
      padding: 18px 16px;
      border: none;
      border-radius: 24px;
      background: linear-gradient(135deg, #0a74da, #2359b8);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 18px 35px rgba(7, 37, 87, 0.22);
      transition: transform .18s ease, background .18s ease;
    }
    #toggleButton:active { transform: scale(.98); }
    #toggleButton.stopped { background: linear-gradient(135deg, #0d263f, #12263e); }
    .live-text {
      min-height: 1.4em;
      font-size: .92rem;
      color: rgba(255,255,255,.4);
      font-style: italic;
      padding: 0 6px;
      word-break: break-word;
    }
    .history {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 14px;
      background: rgba(255,255,255,.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      min-height: 200px;
      max-height: 46vh;
    }
    .entry {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .entry p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #fff;
      word-break: break-word;
    }
    .transcript-panel {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      background: rgba(255,255,255,.02);
      overflow: hidden;
    }
    .transcript-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }
    .transcript-header span {
      flex: 1;
      font-size: .9rem;
      font-weight: 600;
      color: rgba(255,255,255,.7);
    }
    .transcript-toggle {
      font-size: .8rem;
      color: rgba(255,255,255,.5);
    }
    .copy-btn {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.8);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .copy-btn:active { background: rgba(255,255,255,.14); }
    .transcript-list {
      padding: 0 14px 14px;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .transcript-list.closed { display: none; }
    .transcript-entry {
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }
    .transcript-time {
      font-size: .78rem;
      color: rgba(255,255,255,.4);
      margin-bottom: 4px;
      display: block;
    }
    .transcript-entry p {
      margin: 0;
      font-size: .95rem;
      color: rgba(255,255,255,.75);
      line-height: 1.5;
      word-break: break-word;
    }
    @media (max-width: 540px) {
      header { padding-top: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>リアルタイムトランスレーター</h1>
    <div class="select-row">
      <label>
        <span class="select-label">翻訳元</span>
        <select id="sourceLang"></select>
      </label>
      <button id="swapBtn" class="swap-btn" type="button">⇄</button>
      <label>
        <span class="select-label">翻訳先</span>
        <select id="targetLang"></select>
      </label>
    </div>
  </header>
  <main>
    <div class="status-bar">
      <div id="statusIndicator" class="indicator">準備完了</div>
      <button id="toggleButton" class="stopped" type="button">録音を開始</button>
    </div>
    <div id="liveText" class="live-text"></div>
    <div class="history" id="history" aria-live="polite"></div>
    <div class="transcript-panel">
      <div class="transcript-header" id="transcriptHeader">
        <span>文字起こし記録</span>
        <button class="copy-btn" id="copyBtn" type="button">コピー</button>
        <span class="transcript-toggle" id="transcriptToggle">▼</span>
      </div>
      <div class="transcript-list closed" id="transcriptList"></div>
    </div>
  </main>
  <script>
    const languages = [
      { value: 'ja', label: '日本語', recognition: 'ja-JP' },
      { value: 'zh-TW', label: '台湾繁体字', recognition: 'zh-TW' },
      { value: 'tl', label: 'タガログ語', recognition: 'tl-PH' },
      { value: 'en', label: '英語', recognition: 'en-US' }
    ];

    const sourceSelect = document.getElementById('sourceLang');
    const targetSelect = document.getElementById('targetLang');
    const toggleButton = document.getElementById('toggleButton');
    const statusIndicator = document.getElementById('statusIndicator');
    const historyContainer = document.getElementById('history');
    const transcriptList = document.getElementById('transcriptList');
    const transcriptHeader = document.getElementById('transcriptHeader');
    const transcriptToggle = document.getElementById('transcriptToggle');
    const copyBtn = document.getElementById('copyBtn');
    const swapBtn = document.getElementById('swapBtn');
    const liveTextEl = document.getElementById('liveText');

    let recognition = null;
    let isRecording = false;
    let currentSource = 'tl';
    let currentTarget = 'ja';
    let transcriptOpen = false;
    const transcriptLog = [];
    let pendingTranscript = '';
    let translationTimer = null;
    const TRANSLATION_DELAY = 1500;

    function createOptions() {
      languages.forEach(lang => {
        const sourceOption = document.createElement('option');
        sourceOption.value = lang.value;
        sourceOption.textContent = lang.label;
        sourceSelect.appendChild(sourceOption);

        const targetOption = document.createElement('option');
        targetOption.value = lang.value;
        targetOption.textContent = lang.label;
        targetSelect.appendChild(targetOption);
      });
      sourceSelect.value = currentSource;
      targetSelect.value = currentTarget;
    }

    function getLanguageData(value) {
      return languages.find(item => item.value === value);
    }

    // state: 'stopped' | 'recording' | 'processing'
    function updateStatus(text, state = 'stopped') {
      statusIndicator.textContent = text;
      statusIndicator.classList.toggle('recording', state === 'recording');
      statusIndicator.classList.toggle('processing', state === 'processing');
      const active = state !== 'stopped';
      toggleButton.textContent = active ? '録音を停止' : '録音を開始';
      toggleButton.classList.toggle('stopped', !active);
      const locked = state === 'processing';
      sourceSelect.disabled = locked;
      targetSelect.disabled = locked;
      swapBtn.disabled = locked;
    }

    function appendHistory(translatedText) {
      const entry = document.createElement('div');
      entry.className = 'entry';
      const p = document.createElement('p');
      p.textContent = translatedText;
      entry.appendChild(p);
      historyContainer.appendChild(entry);
      historyContainer.scrollTop = historyContainer.scrollHeight;
    }

    function addTranscript(sourceText) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      transcriptLog.push({ time: timeStr, text: sourceText });

      const entry = document.createElement('div');
      entry.className = 'transcript-entry';
      const time = document.createElement('span');
      time.className = 'transcript-time';
      time.textContent = timeStr;
      const p = document.createElement('p');
      p.textContent = sourceText;
      entry.appendChild(time);
      entry.appendChild(p);
      transcriptList.appendChild(entry);
      transcriptList.scrollTop = transcriptList.scrollHeight;
    }

    transcriptHeader.addEventListener('click', () => {
      transcriptOpen = !transcriptOpen;
      transcriptList.classList.toggle('closed', !transcriptOpen);
      transcriptToggle.textContent = transcriptOpen ? '▲' : '▼';
    });

    copyBtn.addEventListener('click', event => {
      event.stopPropagation();
      if (transcriptLog.length === 0) return;
      const text = transcriptLog.map(t => t.text).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'コピー済み';
        setTimeout(() => { copyBtn.textContent = 'コピー'; }, 2000);
      });
    });

    function getPromptText(original) {
      const target = getLanguageData(currentTarget);
      const source = getLanguageData(currentSource);
      let special = '';
      if (currentTarget === 'zh-TW') {
        special = '台湾で使われる繁体字を使用してください。';
      } else if (currentTarget === 'tl') {
        special = 'フィリピンで使われる自然な口語表現を使用してください。';
      }
      return `次のテキストを${target.label}に翻訳してください。${special}翻訳した文章のみを返してください。前置き・注釈・言語に関するコメントは一切不要です。テキストが短くても不完全でも、推測して翻訳し、翻訳文のみを出力してください。\n\n${original}`;
    }

    async function translateText(sourceText) {
      const prompt = getPromptText(sourceText);
      console.log('翻訳リクエスト送信:', sourceText);
      try {
        const response = await fetch('https://my-translator-proxy.a222smile.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            messages: [{ role: 'user', content: [{ type: 'text', text: prompt }] }],
            max_tokens: 1000,
            temperature: 0.2
          })
        });
        console.log('翻訳レスポンス status:', response.status);
        if (!response.ok) {
          const errorData = await response.text();
          console.error('翻訳エラーレスポンス:', response.status, errorData);
          return null;
        }
        const data = await response.json();
        console.log('翻訳レスポンス data:', data);
        if (data.type === 'error') {
          console.error('Claude APIエラー:', data.error?.message);
          return null;
        }
        return data.content?.[0]?.text || null;
      } catch (error) {
        console.error('翻訳fetch失敗 (CORSまたはネットワークエラーの可能性):', error.message);
        return null;
      }
    }

    async function flushTranslation() {
      if (!pendingTranscript) return;
      const toTranslate = pendingTranscript;
      pendingTranscript = '';
      updateStatus('翻訳中...', 'processing');
      const translated = await translateText(toTranslate);
      if (translated) {
        addTranscript(toTranslate);
        appendHistory(translated);
        if (isRecording) updateStatus('録音中', 'recording');
      } else if (isRecording) {
        updateStatus('翻訳に失敗しました。', 'recording');
      }
    }

    function isSentenceComplete(text) {
      return /[。！？.!?]$/.test(text.trim());
    }

    function handleResult(event) {
      const result = event.results[event.resultIndex];
      const transcript = result[0].transcript.trim();
      if (!transcript) return;

      if (!result.isFinal) {
        liveTextEl.textContent = transcript;
        return;
      }

      liveTextEl.textContent = '';
      pendingTranscript += (pendingTranscript ? ' ' : '') + transcript;
      clearTimeout(translationTimer);

      if (isSentenceComplete(pendingTranscript)) {
        flushTranslation();
      } else {
        updateStatus('認識中...', 'processing');
        translationTimer = setTimeout(flushTranslation, TRANSLATION_DELAY);
      }
    }

    function startRecognition() {
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        updateStatus('お使いのブラウザは音声認識に対応していません。', 'stopped');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = getLanguageData(currentSource).recognition;
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => { console.log('音声認識開始'); updateStatus('録音中', 'recording'); };
      recognition.onend = () => {
        console.log('音声認識終了');
        recognition = null;
        if (isRecording) {
          startRecognition();
        } else {
          updateStatus('停止中', 'stopped');
        }
      };
      recognition.onerror = event => {
        console.log('音声認識エラー:', event.error);
        if (event.error === 'aborted' || event.error === 'no-speech') return;
        isRecording = false;
        updateStatus('音声認識エラー: ' + event.error, 'stopped');
      };
      recognition.onresult = event => {
        console.log('音声認識結果:', event.results);
        handleResult(event);
      };
      recognition.start();
      isRecording = true;
      updateStatus('録音中', 'recording');
    }

    function stopRecognition() {
      clearTimeout(translationTimer);
      translationTimer = null;
      if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        recognition.stop();
        recognition = null;
      }
      liveTextEl.textContent = '';
      isRecording = false;
      updateStatus('停止中', 'stopped');
      if (pendingTranscript) flushTranslation();
    }

    function toggleRecording() {
      console.log('toggleRecording呼ばれた', isRecording);
      if (isRecording) {
        stopRecognition();
      } else {
        startRecognition();
      }
    }

    sourceSelect.addEventListener('change', event => {
      currentSource = event.target.value;
      if (isRecording) {
        stopRecognition();
        startRecognition();
      }
    });

    targetSelect.addEventListener('change', event => {
      currentTarget = event.target.value;
    });

    swapBtn.addEventListener('click', () => {
      const tmp = currentSource;
      currentSource = currentTarget;
      currentTarget = tmp;
      sourceSelect.value = currentSource;
      targetSelect.value = currentTarget;
      if (isRecording) {
        stopRecognition();
        startRecognition();
      }
    });

    console.log('ボタンイベント登録完了');
    toggleButton.addEventListener('click', toggleRecording);

    createOptions();
    updateStatus('準備完了', 'stopped');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW登録失敗', err));
      });
    }
  </script>
</body>
</html>
